<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Display</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fascinate&family=Share+Tech&display=swap" rel="stylesheet">
    <script type="module" src="src/main.ts"></script>
</head>
<body>
    <h1>Digital Display</h1>
    
    <h2>Displays</h2>
    <div class="displays-container"></div>

    <h2>Mode</h2>
    <div class="mode-selector">
        <button class="mode-button" data-mode="static">Static</button>
        <button class="mode-button" data-mode="blank">Blank</button>
    </div>

    <div class="mode-page" data-mode="static" style="display:none">
        <br><br>
        <button id="add-item-button">Add Image</button>
        <br>
        <br>
        <img src="" class="preview">
        <h2>Uploaded Images</h2>
        <div class="image-list"></div>
        <br>

        <dialog id="add-dialog">
            <h1>Add Image</h1>
            <label for="file-input" id="file-input-label">Upload Image</label>
            <input id="file-input" type="file" name="photo" accept="image/*">
            <br><br>
            <span>or paste image link:</span>
            <br>
            <input id="image-link-input" type="text" placeholder="https://...">
            <br><br>
            <span> or <a id="text-add-button">add text</a></span>
            <br><br>
            <button class="add-cancel-button">Cancel</button>
        </dialog>

        <dialog id="add-text-dialog">
            <h1>Add Text</h1>
            <div id="add-text-preview-box">
                <canvas id="text-canvas" width="800" height="480">
                    The canvas element is not supported on your browser
                </canvas>
                <div id="add-text-input-wrapper">
                    <textarea id="add-text-input"></textarea>
                </div>
            </div>
            <br>
            <input type="color" id="fg-color-input" value="#000000"><input type="color" id="bg-color-input" value="#FFFFFF">
            <br><br>
            <button id="text-upload-button">Add</button>
            <button id="add-text-dialog-close-button">Cancel</button>
        </dialog>

        <dialog id="confirm-upload-dialog">
            <h1>Upload Image</h1>
            <div id="image-upload-preview-container"><img id="image-upload-preview"></div>
            <br>
            <div id="image-upload-options">
                <select id="fit-input" name="fit">
                    <option value="contain">Contain</option>
                    <option value="cover">Cover</option>
                </select>
                <select id="color-input" name="color">
                    <option value="color">Color</option>
                    <option value="bw">B&W</option>
                </select>
                <select id="background-input" name="background">
                    <option value="white">White</option>
                    <option value="black">Black</option>
                </select>
            </div>
            <br>
            <button class="file-upload-submit-button">Upload Image</button>
            <button class="file-upload-cancel-button">Cancel</button>
        </dialog>
    </div>

    <div class="mode-page" data-mode="blank" style="display:none">
        <br>
        <h3 class="color-name"></h3>
        <select class="blank-color-dropdown">
            <option value="white">White</option>
            <option value="black">Black</option>
            <option value="red">Red</option>
            <option value="yellow">Yellow</option>
            <option value="green">Green</option>
            <option value="blue">Blue</option>
        </select>
        <br><br>
    </div>


    <div class="banner-container">
        <div class="error banner error-message" style="display:none">
        </div>
        <div class="loading-bar banner" style="display:none">
            Loading
        </div>
        <div class="commit-container banner" style="display:none">
            <button class="reset-button">Reset</button>
            <button class="commit-button">Apply</button>
        </div>
    </div>
</body>
</html>
